# Alembic — migrações versionadas do Portal Entregador
# Novas mudanças de schema DEVEM vir para cá (não mais em main_production.py).
# Comandos (com FLASK_APP=src.main_production:create_app):
#   flask db migrate -m "descricao"   # gera revisão
#   flask db upgrade                  # aplica
#   flask db current                  # versão atual

[alembic]
script_location = migrations
prepend_sys_path = .
timezone = UTC

# sqlalchemy.url é sobrescrito por migrations/env.py via DATABASE_URL
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
